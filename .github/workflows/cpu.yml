name: CPU contracts

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables -eo pipefail, including commands logged through tee.
    shell: bash

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    # PR code runs only on disposable GitHub-hosted CPUs, never the RTX worker.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            sanitize: 'OFF'
          - configuration: Debug
            sanitize: 'ON'
    env:
      CC: gcc-13
      CXX: g++-13
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SYNREX_TEST_NATIVE_DIR: ${{ github.workspace }}/build-cpu-${{ matrix.configuration }}
      SYNREX_TEST_LAZPERF_SOURCE_DIR: ${{ github.workspace }}/.deps/laz-perf
      SYNREX_RUN_GPU: '0'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.12'
      - name: Install pinned CPU Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-cpu-ci.lock
          python -m pip check
      - name: Fetch immutable native dependencies
        run: |
          git init .deps/laz-perf
          git -C .deps/laz-perf fetch --depth 1 https://github.com/hobu/laz-perf.git b7bbe26109dc986f42d4fc80b8de3d2b6ca634ce
          git -C .deps/laz-perf checkout --detach FETCH_HEAD
          test "$(git -C .deps/laz-perf rev-parse HEAD)" = b7bbe26109dc986f42d4fc80b8de3d2b6ca634ce
          git init .deps/json
          git -C .deps/json fetch --depth 1 https://github.com/nlohmann/json.git 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
          git -C .deps/json checkout --detach FETCH_HEAD
          test "$(git -C .deps/json rev-parse HEAD)" = 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
      - name: Configure clean CPU build
        run: |
          mkdir -p build-ci-results
          python --version
          "$CXX" --version
          cmake --version
          ninja --version
          cmake -S . -B "$SYNREX_TEST_NATIVE_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DCMAKE_CXX_COMPILER="$CXX" -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS_DEBUG='-O1 -g' \
            -DSYNREX_ENABLE_CUDA=OFF -DSYNREX_SANITIZE=${{ matrix.sanitize }} \
            -DLAZPERF_SOURCE_DIR="$PWD/.deps/laz-perf" \
            -DNLOHMANN_JSON_INCLUDE_DIR="$PWD/.deps/json/single_include" \
            2>&1 | tee build-ci-results/configure.log
      - name: Build with compiler warnings as errors
        run: cmake --build "$SYNREX_TEST_NATIVE_DIR" 2>&1 | tee build-ci-results/build.log
      - name: Native CTest contracts
        run: |
          ctest --test-dir "$SYNREX_TEST_NATIVE_DIR" --output-on-failure --timeout 180 \
            --output-junit "$PWD/build-ci-results/ctest.xml" \
            2>&1 | tee build-ci-results/ctest.log
      - name: Complete pytest suite including export and installed-link checks
        if: ${{ !cancelled() && success() }}
        run: |
          python -m pytest -q -ra --basetemp="$SYNREX_TEST_NATIVE_DIR/pytest" \
            --junitxml=build-ci-results/pytest.xml \
            2>&1 | tee build-ci-results/pytest.log
      - name: Maintained release and relative-link checks
        if: ${{ !cancelled() && success() && matrix.configuration == 'Release' }}
        run: |
          python tools/release_checks.py --check-only --dependency-lock requirements-cpu-ci.lock \
            2>&1 | tee build-ci-results/release.log
      - name: Scoped style checks for maintained changes
        if: ${{ !cancelled() && success() && matrix.configuration == 'Release' }}
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            CHANGE_BASE="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          elif [ -z "$CHANGE_BASE" ] || [ "$CHANGE_BASE" = 0000000000000000000000000000000000000000 ]; then
            CHANGE_BASE="$(git rev-parse HEAD^)"
          fi
          python tools/check_cpu_style.py --base "$CHANGE_BASE" \
            2>&1 | tee build-ci-results/style.log
      - name: Publish results and explicit skip reasons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-${{ matrix.configuration }}-results
          path: |
            build-ci-results/
            build-cpu-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  causal-context-aarch64:
    name: Native AArch64 causal context CPU (no CUDA)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned JSON dependency
        run: |
          set -euo pipefail
          git init -q .deps/json
          git -C .deps/json fetch --quiet --depth=1 https://github.com/nlohmann/json.git 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
          git -C .deps/json checkout --quiet --detach FETCH_HEAD
          test "$(git -C .deps/json rev-parse HEAD)" = 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
      - name: Compile and execute AArch64 causal contract
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p build-causal-aarch64
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I native/include -I .deps/json/single_include native/causal_context.cpp tests/native/causal_context.cpp -o build-causal-aarch64/causal-context-tests -lcrypto
          build-causal-aarch64/causal-context-tests | tee build-causal-aarch64/results.txt
          grep -q CAUSAL_CONTEXT_CPU_PASS build-causal-aarch64/results.txt
          sha256sum build-causal-aarch64/causal-context-tests > build-causal-aarch64/SHA256SUMS
      - name: Retain ARM64 CPU results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: causal-context-aarch64-${{ github.run_id }}
          path: build-causal-aarch64/
          retention-days: 30
          if-no-files-found: warn

  causal-performance-x86:
    name: Immutable context vs original SHA256 x86_64 CPU (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch pinned JSON dependency
        run: |
          set -euo pipefail
          git init -q .deps/json
          git -C .deps/json fetch --quiet --depth=1 https://github.com/nlohmann/json.git 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03
          git -C .deps/json checkout --quiet --detach FETCH_HEAD
      - name: Compile identical CPU fixture against original SHA baseline and immutable candidate
        run: |
          set -euo pipefail
          mkdir -p .baseline/include/synrex .baseline/native build-causal-perf
          BASE_SHA=18c6e6da45f24ae066226459ee0580e8cfb774f5
          test "$(git cat-file -t "$BASE_SHA")" = commit
          git show "$BASE_SHA:native/include/synrex/causal_context.hpp" > .baseline/include/synrex/causal_context.hpp
          git show "$BASE_SHA:native/causal_context.cpp" > .baseline/native/causal_context.cpp
          g++ -std=c++17 -O3 -DNDEBUG -DSYNREX_PERF_BASELINE -Wall -Wextra -Wpedantic -Werror \
            -I .baseline/include -I native/include -I .deps/json/single_include \
            .baseline/native/causal_context.cpp tests/native/causal_context_perf.cpp \
            -o build-causal-perf/baseline -lcrypto
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            -I native/include -I .deps/json/single_include \
            native/causal_context.cpp tests/native/causal_context_perf.cpp \
            -o build-causal-perf/candidate -lcrypto
          printf 'base=%s\ncandidate=%s\n' "$BASE_SHA" "$GITHUB_SHA" > build-causal-perf/source-lock.txt
      - name: Run same 3.145M source-point workload and record exact throughput
        run: |
          set -euo pipefail
          build-causal-perf/baseline | tee build-causal-perf/baseline.json
          build-causal-perf/candidate | tee build-causal-perf/candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("build-causal-perf/baseline.json").read_text())
          b = json.loads(Path("build-causal-perf/candidate.json").read_text())
          assert a["total_points"] == b["total_points"] == 3145728
          assert a["checksum"] == b["checksum"]
          assert a["context_processed"] == b["context_processed"]
          assert a["windows"] == b["windows"] == 192
          assert a["fresh_points_per_second"] > 0 and b["fresh_points_per_second"] > 0
          ratio = b["fresh_points_per_second"] / a["fresh_points_per_second"]
          receipt = {"schema":"synrex.causal_context_perf_comparison.v1",
                     "scope":"isolated CPU assemble+commit, no real model, no GPU",
                     "baseline_source":"18c6e6da45f24ae066226459ee0580e8cfb774f5",
                     "candidate_faster_by":ratio,"baseline":a,"candidate":b}
          Path("build-causal-perf/comparison.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("CPU_ONLY_IMMUTABLE_CONTEXT_RATIO", round(ratio,2))
          PY
          sha256sum build-causal-perf/baseline build-causal-perf/candidate > build-causal-perf/SHA256SUMS
      - name: Retain measured speed and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: causal-context-cpu-perf-${{ github.run_id }}
          path: build-causal-perf/
          retention-days: 30
          if-no-files-found: warn
