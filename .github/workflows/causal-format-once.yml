name: Temporary sealed test formatter review-only
on:
  push:
    branches:
      - campaign/immutable-sealed-cpu-r2
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: clang-format exactly one modified C++ test file
        run: |
          set -euo pipefail
          clang-format -i tests/native/sealed_cell.cpp
          printf 'SYNREX_FORMAT_BEGIN:tests/native/sealed_cell.cpp\n'
          base64 -w0 tests/native/sealed_cell.cpp
          printf '\nSYNREX_FORMAT_END:tests/native/sealed_cell.cpp\n'
