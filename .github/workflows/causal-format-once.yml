name: Temporary causal context formatter review-only
on:
  push:
    branches:
      - campaign/causal-context-cpu-r1
permissions:
  contents: read
jobs:
  native-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Format exact three draft C++ files (no repository push)
        run: |
          set -euo pipefail
          clang-format --version
          clang-format -i native/causal_context.cpp native/include/synrex/causal_context.hpp tests/native/causal_context.cpp
          for path in native/causal_context.cpp native/include/synrex/causal_context.hpp tests/native/causal_context.cpp; do
            printf 'SYNREX_FORMAT_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nSYNREX_FORMAT_END:%s\n' "$path"
          done
